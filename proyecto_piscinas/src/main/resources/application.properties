spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_piscinas?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

server.port=${SERVER_PORT:8080}
server.error.whitelabel.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Supuesto academico: tarifa general del IVA de Costa Rica (13%).
# Casos exentos o con tarifa reducida requieren validacion fiscal antes de uso comercial.
tienda.impuesto.tasa=0.13
