<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Servicios - Tienda Piscinas</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <header th:replace="~{fragmentos/encabezado :: encabezado}"></header>
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="h2 mb-1" th:text="#{service.catalog}">Servicios para piscinas</h1>
                <p class="text-muted mb-0" th:text="#{service.catalog.subtitle}">Solicite atención para mantenimiento, limpieza e instalación.</p>
            </div>
            <a sec:authorize="hasRole('ADMINISTRADOR')" class="btn btn-primary"
               th:href="@{/administracion/servicios}" th:text="#{service.manage}">Gestionar servicios</a>
        </div>

        <div class="row g-4" th:if="${!#lists.isEmpty(servicios)}">
            <div class="col-md-6 col-lg-4" th:each="servicio : ${servicios}">
                <article class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex flex-column">
                        <h2 class="h5" th:text="${servicio.nombre}">Servicio</h2>
                        <p class="text-muted flex-grow-1" th:text="${servicio.descripcion}">Descripción</p>
                        <p class="fw-bold text-primary"
                           th:text="|#{common.from} ₡${#numbers.formatDecimal(servicio.precioBase, 1, 'COMMA', 2, 'POINT')}|">Precio base</p>
                        <a sec:authorize="hasRole('CLIENTE')" class="btn btn-primary"
                           th:href="@{/cliente/solicitudes/nueva}" th:text="#{service.request}">Solicitar servicio</a>
                        <a sec:authorize="isAnonymous()" class="btn btn-outline-primary" th:href="@{/login}">
                            <span th:text="#{service.loginRequest}">Ingrese para solicitar</span>
                        </a>
                    </div>
                </article>
            </div>
        </div>
        <div class="alert alert-info" th:if="${#lists.isEmpty(servicios)}" th:text="#{service.empty}">No hay servicios activos en este momento.</div>
    </main>
    <footer th:replace="~{fragmentos/piePagina :: piePagina}"></footer>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
