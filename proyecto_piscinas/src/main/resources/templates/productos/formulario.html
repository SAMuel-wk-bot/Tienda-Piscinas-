<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Formulario de producto - Tienda Piscinas</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <header th:replace="~{fragmentos/encabezado :: encabezado}"></header>
    <main class="container py-5">
        <div class="card border-0 shadow-sm mx-auto" style="max-width: 52rem;">
            <div class="card-body p-4">
                <h1 class="h3" th:text="${producto.idProducto == null} ? #{product.new} : #{product.edit}">Producto</h1>
                <form method="post" th:action="@{/administracion/productos/guardar}" th:object="${producto}">
                    <input type="hidden" th:field="*{idProducto}"/>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="nombreProducto" class="form-label" th:text="#{common.name}">Nombre</label>
                            <input id="nombreProducto" type="text" class="form-control" th:field="*{nombreProducto}"
                                   th:classappend="${#fields.hasErrors('nombreProducto')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{nombreProducto}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="categoria" class="form-label" th:text="#{common.category}">Categoría</label>
                            <select id="categoria" class="form-select" th:field="*{categoria}"
                                    th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                                <option value="" th:text="#{action.select}">Seleccione</option>
                                <option th:each="categoriaItem : ${categorias}" th:value="${categoriaItem.idCategoria}"
                                        th:text="${categoriaItem.nombreCategoria}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{categoria}"></div>
                        </div>
                        <div class="col-12">
                            <label for="descripcion" class="form-label" th:text="#{common.description}">Descripción</label>
                            <textarea id="descripcion" class="form-control" rows="3" th:field="*{descripcion}"
                                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback" th:errors="*{descripcion}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="precio" class="form-label" th:text="#{common.price}">Precio</label>
                            <input id="precio" type="number" min="0.01" step="0.01" class="form-control" th:field="*{precio}"
                                   th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{precio}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="stock" class="form-label" th:text="#{common.stock}">Existencias</label>
                            <input id="stock" type="number" min="0" class="form-control" th:field="*{stock}"
                                   th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{stock}"></div>
                        </div>
                    </div>
                    <button class="btn btn-primary mt-4" type="submit" th:text="#{action.save}">Guardar</button>
                    <a class="btn btn-outline-secondary mt-4" th:href="@{/administracion/productos}" th:text="#{action.cancel}">Cancelar</a>
                </form>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragmentos/piePagina :: piePagina}"></footer>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
