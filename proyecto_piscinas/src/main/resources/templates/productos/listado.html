<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Inventario de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Gestión de Inventario - Piscinas</h2>
            </div>
            <div class="card-body">
                <h4 class="card-title mb-4" th:text="${titulo}"></h4>
                
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prod : ${listaProductos}">
                            <td th:text="${prod.idProducto}">1</td>
                            <td th:text="${prod.nombreProducto}">Gafas</td>
                            <td th:text="${prod.categoria.nombreCategoria}">Accesorios</td>
                            <td th:text="${prod.descripcion}">Descripción de prueba</td>
                            <td th:text="'$' + ${prod.precio}">$0.00</td>
                            <td>
                                <span th:text="${prod.stock}" 
                                      th:classappend="${prod.stock < 10} ? 'badge bg-danger' : 'badge bg-success'">
                                    0
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listaProductos)}">
                            <td colspan="6" class="text-center text-muted">No hay productos en el inventario.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
