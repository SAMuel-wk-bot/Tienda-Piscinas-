<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <header th:fragment="encabezado">

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container">

                <!-- Nombre o logo de la empresa -->
                <a class="navbar-brand fw-bold"
                   th:href="@{/}">
                    Piscinas Santamaría
                </a>

                <!-- Botón para dispositivos móviles -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal"
                        aria-expanded="false"
                        aria-label="Mostrar menú">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Opciones del menú -->
                <div class="collapse navbar-collapse"
                     id="menuPrincipal">

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link active"
                               aria-current="page"
                               th:href="@{/}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/servicios}">
                                Servicios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/productos}">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                            <a class="nav-link" th:href="@{/cliente/solicitudes}">Mis solicitudes</a>
                        </li>

                        <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                            <a class="nav-link" th:href="@{/cliente/pedidos}">Mis pedidos</a>
                        </li>

                        <li class="nav-item" sec:authorize="hasRole('CLIENTE')">
                            <a class="nav-link"
                               th:href="@{/carrito}">
                                Carrito
                            </a>
                        </li>

                        <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                            <a class="nav-link" th:href="@{/administracion}">Administración</a>
                        </li>

                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link" th:href="@{/login}">Ingresar</a>
                        </li>

                        <li class="nav-item" sec:authorize="isAnonymous()">
                            <a class="nav-link" th:href="@{/registro}">Registro</a>
                        </li>

                    </ul>

                    <form sec:authorize="isAuthenticated()"
                          th:action="@{/logout}" method="post" class="ms-lg-3">
                        <button class="btn btn-outline-light" type="submit">Cerrar sesión</button>
                    </form>

                </div>

            </div>
        </nav>

    </header>

</body>
</html>
