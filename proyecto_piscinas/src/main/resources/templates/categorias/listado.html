<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Categorías - Tienda Piscinas</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body class="bg-light">
    <header th:replace="~{fragmentos/encabezado :: encabezado}"></header>
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 mb-0" th:text="#{category.management}">Gestión de categorías</h1>
            <a class="btn btn-primary" th:href="@{/administracion/categorias/nuevo}" th:text="#{category.new}">Nueva categoría</a>
        </div>
        <div th:if="${exito}" class="alert alert-success" th:text="${#messages.msg(exito)}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="table-responsive shadow-sm">
            <table class="table table-striped table-hover bg-white mb-0">
                <thead class="table-primary"><tr><th th:text="#{common.name}">Nombre</th><th th:text="#{common.description}">Descripción</th><th th:text="#{common.actions}">Acciones</th></tr></thead>
                <tbody>
                    <tr th:each="categoria : ${categorias}">
                        <td th:text="${categoria.nombreCategoria}">Categoría</td>
                        <td th:text="${categoria.descripcion}">Descripción</td>
                        <td class="text-nowrap">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/administracion/categorias/editar/{id}(id=${categoria.idCategoria})}" th:text="#{action.edit}">Modificar</a>
                            <form class="d-inline" method="post"
                                  th:action="@{/administracion/categorias/eliminar/{id}(id=${categoria.idCategoria})}">
                                <button class="btn btn-sm btn-outline-danger" type="submit"
                                        th:onclick="|return confirm('#{category.confirmDelete}')|" th:text="#{action.delete}">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categorias)}">
                        <td colspan="3" class="text-center text-muted" th:text="#{category.empty}">No hay categorías registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer th:replace="~{fragmentos/piePagina :: piePagina}"></footer>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
