<!DOCTYPE html>
<html lang="es"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<body>

    <header th:fragment="encabezado">

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container">

                <!-- Nombre o logo de la empresa -->
                <a class="navbar-brand fw-bold"
                   th:href="@{/}">
                    Piscinas Santamaría
                </a>

                <!-- Botón para dispositivos móviles -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal"
                        aria-expanded="false"
                        aria-label="Mostrar menú">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Opciones del menú -->
                <div class="collapse navbar-collapse"
                     id="menuPrincipal">

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link active"
                               aria-current="page"
                               th:href="@{/}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="#servicios">
                                Servicios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="#productos">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               href="#contacto">
                                Contacto
                            </a>
                        </li>

                    </ul>

                    <!-- Botón de WhatsApp -->
                    <a href="https://wa.me/50688041005"
                       target="_blank"
                       rel="noopener noreferrer"
                       class="btn btn-success ms-lg-3">

                        WhatsApp

                    </a>

                </div>

            </div>
        </nav>

    </header>

</body>
</html>
